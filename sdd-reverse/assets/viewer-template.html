<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SDD Viewer — {{PROJECT_NAME}}</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --bg-elev: #161922;
    --bg-soft: #1c2030;
    --border: #262a38;
    --text: #e6e8ee;
    --text-dim: #9aa0b4;
    --accent: #7c8cff;
    --accent-soft: #2a2f4a;
    --inferred: #4ea1ff;
    --assumption: #ffb84d;
    --confirmed: #4ade80;
    --code-bg: #0a0c12;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", Monaco, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-rows: auto 1fr; }

  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 .project { color: var(--accent); }
  header .meta { font-size: 12px; color: var(--text-dim); }

  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 6px 14px;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); border-color: var(--accent-soft); }
  .tab.active { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }

  main { display: grid; grid-template-columns: 280px 1fr; height: 100%; overflow: hidden; }

  aside {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 8px;
  }
  aside h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 12px 12px 8px;
    font-weight: 600;
  }
  .toc { list-style: none; padding: 0; margin: 0; }
  .toc li { margin: 0; }
  .toc a {
    display: block;
    padding: 5px 12px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    border-radius: 4px;
    border-left: 2px solid transparent;
    transition: all 0.1s;
  }
  .toc a:hover { color: var(--text); background: var(--bg-soft); }
  .toc a.active { color: var(--accent); border-left-color: var(--accent); background: var(--bg-soft); }
  .toc .level-3 { padding-left: 24px; font-size: 12px; }
  .toc .level-4 { padding-left: 36px; font-size: 12px; color: var(--text-dim); opacity: 0.7; }

  .content {
    overflow-y: auto;
    padding: 32px 48px 80px;
    max-width: 100%;
  }
  .content-inner { max-width: 820px; margin: 0 auto; }

  .pane { display: none; }
  .pane.active { display: block; }

  /* Markdown styles */
  .content h1 { font-size: 28px; margin: 0 0 8px; font-weight: 700; }
  .content h2 { font-size: 22px; margin: 36px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .content h3 { font-size: 17px; margin: 28px 0 10px; font-weight: 600; }
  .content h4 { font-size: 14px; margin: 20px 0 8px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .content p { line-height: 1.65; margin: 10px 0; color: var(--text); }
  .content ul, .content ol { line-height: 1.65; padding-left: 22px; }
  .content li { margin: 4px 0; }
  .content a { color: var(--accent); }
  .content blockquote {
    border-left: 3px solid var(--accent);
    background: var(--bg-soft);
    padding: 10px 16px;
    margin: 16px 0;
    color: var(--text-dim);
    border-radius: 0 6px 6px 0;
  }
  .content code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.88em;
  }
  .content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 14px 0;
  }
  .content pre code { background: none; border: none; padding: 0; font-size: 13px; }

  .content table {
    border-collapse: collapse;
    width: 100%;
    margin: 14px 0;
    font-size: 13px;
  }
  .content th, .content td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  .content th { background: var(--bg-soft); font-weight: 600; }
  .content tr:nth-child(even) td { background: rgba(255,255,255,0.015); }

  .content hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

  /* Markers */
  .marker {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 0.78em;
    font-family: var(--font-mono);
    font-weight: 600;
    margin-right: 4px;
    vertical-align: baseline;
  }
  .marker-inferred { background: rgba(78, 161, 255, 0.15); color: var(--inferred); border: 1px solid rgba(78, 161, 255, 0.3); }
  .marker-assumption { background: rgba(255, 184, 77, 0.15); color: var(--assumption); border: 1px solid rgba(255, 184, 77, 0.3); }
  .marker-confirmed { background: rgba(74, 222, 128, 0.15); color: var(--confirmed); border: 1px solid rgba(74, 222, 128, 0.3); }

  /* Mermaid */
  .mermaid {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin: 16px 0;
    text-align: center;
  }

  /* Filter chip toolbar */
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .chip {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    background: var(--bg-soft);
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-family: var(--font-mono);
  }
  .chip strong { color: var(--text); margin-left: 4px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-soft); }
</style>
</head>
<body>

<header>
  <h1>SDD · <span class="project">{{PROJECT_NAME}}</span></h1>
  <div class="tabs">
    <button class="tab active" data-pane="functional">Funcional</button>
    <button class="tab" data-pane="technical">Técnica</button>
  </div>
  <div class="meta">{{DATE}}</div>
</header>

<main>
  <aside>
    <h3>Tabla de contenidos</h3>
    <ul class="toc" id="toc"></ul>
  </aside>

  <div class="content">
    <div class="content-inner">
      <div class="toolbar" id="toolbar"></div>
      <div class="pane active" id="pane-functional"></div>
      <div class="pane" id="pane-technical"></div>
    </div>
  </div>
</main>

<script id="md-functional" type="text/markdown">
{{FUNCTIONAL_MD}}
</script>

<script id="md-technical" type="text/markdown">
{{TECHNICAL_MD}}
</script>

<script>
  // Configure marked
  marked.setOptions({ gfm: true, breaks: false });

  // Highlight markers in rendered HTML
  function highlightMarkers(html) {
    return html
      .replace(/\[INFERRED\]/g, '<span class="marker marker-inferred">INFERRED</span>')
      .replace(/\[ASSUMPTION\]/g, '<span class="marker marker-assumption">ASSUMPTION</span>')
      .replace(/\[CONFIRMED\]/g, '<span class="marker marker-confirmed">CONFIRMED</span>');
  }

  // Extract mermaid blocks before markdown rendering, replace with placeholders, then re-inject
  function renderMarkdown(md) {
    const mermaidBlocks = [];
    md = md.replace(/```mermaid\n([\s\S]*?)```/g, (_, code) => {
      const i = mermaidBlocks.length;
      mermaidBlocks.push(code);
      return `<div class="mermaid" data-mermaid-idx="${i}"></div>`;
    });
    let html = marked.parse(md);
    html = highlightMarkers(html);
    // Re-inject mermaid sources
    html = html.replace(/<div class="mermaid" data-mermaid-idx="(\d+)"><\/div>/g, (_, idx) => {
      return `<div class="mermaid">${mermaidBlocks[parseInt(idx)]}</div>`;
    });
    return html;
  }

  function buildTOC(container) {
    const items = [];
    container.querySelectorAll('h2, h3').forEach((h, i) => {
      const id = 'h-' + (h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 60)) + '-' + i;
      h.id = id;
      items.push({
        id,
        text: h.textContent.trim(),
        level: parseInt(h.tagName.slice(1))
      });
    });
    return items;
  }

  function renderTOC(items) {
    const toc = document.getElementById('toc');
    toc.innerHTML = items.map(i =>
      `<li><a href="#${i.id}" class="level-${i.level}" data-target="${i.id}">${i.text}</a></li>`
    ).join('');
    toc.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.getElementById(a.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function countMarkers(html) {
    const inferred = (html.match(/marker-inferred/g) || []).length;
    const assumption = (html.match(/marker-assumption/g) || []).length;
    const confirmed = (html.match(/marker-confirmed/g) || []).length;
    return { inferred, assumption, confirmed };
  }

  function renderToolbar(counts) {
    const t = document.getElementById('toolbar');
    t.innerHTML = `
      <span class="chip">Inferred <strong>${counts.inferred}</strong></span>
      <span class="chip">Assumption <strong>${counts.assumption}</strong></span>
      <span class="chip">Confirmed <strong>${counts.confirmed}</strong></span>
    `;
  }

  // Read embedded markdown
  const mdFunctional = document.getElementById('md-functional').textContent.trim();
  const mdTechnical = document.getElementById('md-technical').textContent.trim();

  const paneF = document.getElementById('pane-functional');
  const paneT = document.getElementById('pane-technical');
  paneF.innerHTML = renderMarkdown(mdFunctional);
  paneT.innerHTML = renderMarkdown(mdTechnical);

  // TOCs (one per pane, swapped on tab change)
  const tocF = buildTOC(paneF);
  const tocT = buildTOC(paneT);

  function activatePane(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.pane === name));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
    const items = name === 'functional' ? tocF : tocT;
    renderTOC(items);
    const html = (name === 'functional' ? paneF : paneT).innerHTML;
    renderToolbar(countMarkers(html));
    document.querySelector('.content').scrollTop = 0;
  }

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => activatePane(t.dataset.pane));
  });

  // Init
  activatePane('functional');

  // Mermaid init
  mermaid.initialize({ startOnLoad: true, theme: 'dark', themeVariables: { background: '#1c2030', primaryColor: '#262a38', primaryTextColor: '#e6e8ee', lineColor: '#7c8cff' } });
  mermaid.run();
</script>

</body>
</html>
